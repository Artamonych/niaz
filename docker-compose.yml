# Тестовый стенд: приложение + Caddy, который сам получает сертификат
# и добавляет заголовок запрета индексации.
#
# Запуск на VPS:
#   cp .env.example .env && отредактировать
#   docker compose up -d --build

services:
  # Отрабатывает и завершается: миграции и первичное наполнение базы.
  migrate:
    build:
      context: .
      target: migrator
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    environment:
      DATABASE_URL: file:/app/data-db/niaz.db
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FIO: ${ADMIN_FIO}
    volumes:
      - db:/app/data-db
    restart: 'no'

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: file:/app/data-db/niaz.db
      AUTH_SECRET: ${AUTH_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      # Пусто или что угодно кроме true — стенд закрыт от поисковиков.
      SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
      UPLOADS_DIR: /app/uploads
      CRM_HOST: ${CRM_HOST:-}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      TG_API_BASE: ${TG_API_BASE:-}
      TG_PROXY_SECRET: ${TG_PROXY_SECRET:-}
      TG_JOIN_CODE: ${TG_JOIN_CODE:-}
    volumes:
      - db:/app/data-db
      - uploads:/app/uploads
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db:
  uploads:
  caddy_data:
  caddy_config:
