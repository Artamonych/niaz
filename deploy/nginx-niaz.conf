# Тестовый стенд НиАЗ. Ставится в /etc/nginx/sites-available/niaz,
# ДОМЕН меняется на адрес стенда при установке (порядок — deploy/README.md).
#
# Соседние сайты этого nginx не затрагиваются: блок отдельный, по server_name.

server {
    listen 80;
    listen [::]:80;
    server_name ДОМЕН;

    # certbot подставит сюда редирект на https при выпуске сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 — в listen, а не отдельной директивой `http2 on;`: её nginx на
    # VPS не знает (появилась в 1.25.1), и конфиг не проходит nginx -t.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ДОМЕН;

    ssl_certificate     /etc/letsencrypt/live/ДОМЕН/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ДОМЕН/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Главный рубеж защиты от индексации. Заголовок сильнее robots.txt: тот
    # запрещает обход, а этот — попадание в индекс, даже если на стенд
    # кто-то сослался. Снять только при переезде на боевой домен.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Год HTTPS без includeSubDomains: поддомены живут своей жизнью (почтовый
    # узел, будущие сервисы), и загонять их в это правило заранее не нужно.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Второй рубеж под XSS (п. 34 бэклога): чужой скрипт с внешнего адреса не
    # подключится, страницу нельзя показать в чужом фрейме, формы уходят
    # только к себе. 'unsafe-inline' для скриптов пока нужен: Next печатает
    # данные страницы инлайном. Полный запрет инлайна потребует одноразовых
    # меток (nonce) из приложения — это отдельная задача.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; form-action 'self'" always;

    # Когда подключат Яндекс.Метрику, в правило выше добавляются источники
    # счётчика, иначе политика его не пропустит:
    #   script-src … https://mc.yandex.ru;
    #   img-src … https://mc.yandex.ru;
    #   connect-src … https://mc.yandex.ru https://mc.yandex.com;

    # Фото новостей грузятся по одному, до 15 МБ каждое — плюс запас на форму.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Пустой Connection — чтобы соединение с приложением держалось открытым.
        # Вебсокетов в готовой сборке нет, «upgrade» здесь только мешал.
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # Статика Next.js неизменяемая: её можно кешировать надолго.
    # add_header в location отменяет заголовки уровня server, поэтому нужные
    # повторяются здесь целиком — иначе на статике их не будет вовсе.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Свой заголовок вместо пришедшего от приложения, иначе он придёт дважды.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Фотографии каталога: имена неизменяемы, а отдавались они с max-age=0 и
    # перезапрашивались при каждом визите (п. 35 бэклога). Заголовок от
    # приложения здесь перекрывается.
    location /media/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Знак завода: файл меняется только вместе с фирменным стилем.
    location /brand/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Оптимизатор картинок: сам результат неизменяем при тех же параметрах.
    location /_next/image {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
