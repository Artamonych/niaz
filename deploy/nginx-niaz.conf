# Тестовый стенд НиАЗ. Ставится в /etc/nginx/sites-available/niaz,
# ДОМЕН подставляется скриптом deploy/setup-vps.sh.
#
# Соседние сайты этого nginx не затрагиваются: блок отдельный, по server_name.

server {
    listen 80;
    listen [::]:80;
    server_name ДОМЕН;

    # certbot подставит сюда редирект на https при выпуске сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 — в listen, а не отдельной директивой `http2 on;`: её nginx на
    # VPS не знает (появилась в 1.25.1), и конфиг не проходит nginx -t.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ДОМЕН;

    ssl_certificate     /etc/letsencrypt/live/ДОМЕН/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ДОМЕН/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Главный рубеж защиты от индексации. Заголовок сильнее robots.txt: тот
    # запрещает обход, а этот — попадание в индекс, даже если на стенд
    # кто-то сослался. Снять только при переезде на боевой домен.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Фото новостей грузятся по одному, до 15 МБ каждое — плюс запас на форму.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Статика Next.js неизменяемая: её можно кешировать надолго.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
