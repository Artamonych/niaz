# CRM НиАЗ на своём домене. Ставится в /etc/nginx/sites-available/niazcrm.
#
# Приложение то же, что у сайта (127.0.0.1:3010): какой домен что отдаёт,
# решает proxy.ts по переменной CRM_HOST. Здесь только TLS, редиректы и
# заголовки. Соседние сайты этого nginx не затрагиваются.
#
# Порядок включения — deploy/README.md, раздел про домен CRM.

server {
    listen 80;
    listen [::]:80;
    server_name niazcrm.ru www.niazcrm.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://niazcrm.ru$request_uri;
    }
}

# www — только редирект: CRM_HOST один, и вход должен жить на одном адресе,
# иначе cookie сессии с www и без него разойдутся.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.niazcrm.ru;

    ssl_certificate     /etc/letsencrypt/live/niazcrm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/niazcrm.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://niazcrm.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name niazcrm.ru;

    ssl_certificate     /etc/letsencrypt/live/niazcrm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/niazcrm.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # CRM не индексируется никогда — в отличие от стенда, этот заголовок
    # не снимается и при переезде сайта на боевой домен.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Фото новостей грузятся по одному, до 15 МБ каждое — плюс запас на форму.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
