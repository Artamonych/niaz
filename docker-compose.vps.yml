# Вариант для VPS, где 80/443 уже держит nginx: поднимаем только приложение
# на локальном порту, наружу его выставляет системный nginx.
#
#   docker compose -f docker-compose.vps.yml up -d --build

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    container_name: niaz-app
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/app/data-db/niaz.db
      AUTH_SECRET: ${AUTH_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FIO: ${ADMIN_FIO}
    volumes:
      - db:/app/data-db
    # Только на петлю: снаружи контейнер недоступен, всё идёт через nginx.
    ports:
      - '127.0.0.1:3010:3000'

volumes:
  db:
